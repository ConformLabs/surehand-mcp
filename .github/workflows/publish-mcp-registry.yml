name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry as io.github.ConformLabs/surehand-mcp.
# GitHub's OIDC token proves the repo belongs to ConformLabs, so no secret is needed.
# Runs when a stable release is published (the release script has already pointed server.json at its .mcpb:
# version, URL, fileSha256), or by hand. Pre-releases are skipped.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json matches its release asset
        run: |
          set -euo pipefail
          url=$(jq -r '.packages[0].identifier' server.json)
          want=$(jq -r '.packages[0].fileSha256' server.json)
          curl --fail --location --silent --show-error --output bundle.mcpb "$url"
          got=$(sha256sum bundle.mcpb | cut -d' ' -f1)
          echo "$url: $got"
          test "$got" = "$want"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
