<!DOCTYPE html>
<!-- Conform Labs installer frame for the Mac Installer's welcome and conclusion pages (installer/common/frame.mjs fills it in).
     The Conform Labs endorsement is on the background image (installer/common/generate-art.mjs). -->
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark">
<style>
:root{--text:#14161A;--text2:#3B3D42;--text3:#6E6B65;--accent:@ACCENT_LIGHT@}
@media (prefers-color-scheme: dark){:root{--text:#F2EFE8;--text2:#D8D6D0;--text3:#A9A69F;--accent:@ACCENT_DARK@}}
html,body{background:transparent}
body{margin:8px;font-family:-apple-system,"Helvetica Neue",sans-serif;font-size:13px;line-height:1.45;color:var(--text2);}
h1{font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.01em;color:var(--text);margin:0}
h1 .version{font-weight:400;color:var(--text3)}
p.for{margin:2px 0 14px;font-size:12px;color:var(--text3)}
b,strong{color:var(--text);font-weight:600}
ul,ol{padding-left:20px}
li{margin:3px 0}
li::marker{color:var(--text3)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:Menlo,monospace;font-size:11.5px;color:var(--text)}
</style></head>
<body>
@BODY@
</body></html>
