<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AE MCP</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <div>
      <div id="title">AE MCP</div>
      <div id="sub" class="muted">checking…</div>
    </div>
  </header>
  <div id="update" class="banner" hidden>
    <span id="updateText"></span>
    <button id="updateBtn">Download</button>
  </div>
  <section class="row">
    <button id="test">Test</button>
    <button id="refresh">Refresh</button>
    <button id="diag" title="Copies a report to paste into a bug report or a chat">Copy diagnostics</button>
  </section>
  <section class="row setting">
    <label for="profile">AI tools</label>
    <select id="profile">
      <option value="core">Core (faster, recommended)</option>
      <option value="full">Full (all tools)</option>
    </select>
  </section>
  <div id="profileNote" class="muted small" hidden>Saved. Restart your AI app to apply.</div>
  <section>
    <div class="label">Recent calls</div>
    <ul id="log"><li class="muted">No calls yet</li></ul>
  </section>
  <footer class="muted" id="foot"></footer>
  <script src="js/bridge-core.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
