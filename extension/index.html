<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Surehand MCP</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <header>
    <span id="dot" class="dot"></span>
    <div>
      <div id="title">Surehand MCP</div>
      <div id="sub" class="muted">checking…</div>
    </div>
  </header>
  <div id="update" class="banner" hidden>
    <span id="updateText"></span>
    <button id="updateBtn">Update</button>
  </div>

  <section id="approvals" hidden>
    <div class="label">Waiting for your approval</div>
    <div id="approvalList"></div>
  </section>

  <section class="row">
    <button id="test">Test</button>
    <button id="diag" title="Copies a report to paste into a bug report or a chat">Copy diagnostics</button>
    <button id="openLog" title="Show the full activity log file">Open log</button>
  </section>

  <section class="grid">
    <label for="perm">Permissions</label>
    <select id="perm">
      <option value="full">Full access</option>
      <option value="ask">Ask before every change</option>
      <option value="read-only">Read-only</option>
    </select>
    <label for="shell">Shell commands</label>
    <select id="shell">
      <option value="on">Allowed</option>
      <option value="off">Blocked</option>
    </select>
    <label for="profile">AI tools</label>
    <select id="profile">
      <option value="core">Core (faster, recommended)</option>
      <option value="full">Full (all tools)</option>
    </select>
  </section>
  <div id="note" class="muted small" hidden></div>

  <section>
    <div class="label">Activity <span class="muted" id="activityHint">(click an entry for details)</span></div>
    <ul id="log"><li class="muted">No calls yet</li></ul>
  </section>
  <footer class="muted" id="foot"></footer>
  <script src="js/bridge-core.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
