<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Surehand needs your OK</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
<section class="popup" role="dialog" aria-labelledby="pTitle" aria-describedby="pWhat">
  <header class="head">
    <svg class="tile" width="24" height="24" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200"></rect><g transform="translate(24 24) scale(0.76)"><path d="M150 62 C128 18 50.5 50.5 78.8 78.8 L121.2 121.2 C149.5 149.5 72 182 50 138" fill="none" stroke="#14161A" stroke-width="24" stroke-linecap="round"></path><circle cx="57.6" cy="57.6" r="15" fill="#14161A"></circle><circle cx="142.4" cy="142.4" r="15" fill="#14161A"></circle></g></svg>
    <span id="pTitle" class="ptitle">Surehand needs your OK</span>
    <span id="pTime" class="time num" title="Time left to answer"></span>
  </header>
  <div id="pBody" class="pbody">
    <div id="pAsks" class="label"></div>
    <div id="pWhat" class="what"></div>
    <div id="pSays" class="says" hidden></div>
    <div id="pChips" class="chips"></div>
    <div class="two">
      <button id="pAllow" class="btn main big" type="button">Allow</button>
      <button id="pDeny" class="btn big" type="button">Deny</button>
    </div>
    <div class="pfoot"><span id="pMore">Closes after you answer</span><button id="pDetails" class="link under" type="button">Show details in the panel</button></div>
  </div>
  <div id="pDone" class="pbody" hidden><div id="pDoneMsg" class="done" role="status" aria-live="assertive"></div></div>
</section>
<script src="js/paths.js"></script>
<script src="js/panel-model.js"></script>
<script src="js/control.js"></script>
<script src="js/approval.js"></script>
</body>
</html>
